name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build frontend (esbuild)
        run: |
          npm install
          npm run build

      - name: Generate icon + version resource
        run: |
          go run github.com/tc-hib/go-winres@latest make -in winres/winres.json -out rsrc
          del rsrc_windows_arm64.syso

      - name: Build exe
        run: go build -ldflags="-H windowsgui -s -w" -o MelodyV3.exe .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: MelodyV3.exe
