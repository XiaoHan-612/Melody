name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Generate icon + version resource
        run: go run github.com/tc-hib/go-winres@latest -i winres/winres.json -o rsrc_windows_amd64.syso

      - name: Build exe
        run: go build -ldflags="-H windowsgui -s -w" -o MelodyV3.exe .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: MelodyV3.exe
