<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MelodyV3</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#E8ECF0;-webkit-app-region:drag;user-select:none}
body[data-mode="desktop"]{background:rgba(12,16,28,.92);border-radius:12px}
body[data-mode="mini"]{background:rgba(14,18,30,.95);border-radius:14px}
button{-webkit-app-region:no-drag}
.mini{display:flex;align-items:center;gap:12px;height:100%;padding:10px 14px}
.cover{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,rgba(0,122,255,.15),rgba(0,122,255,.04)) center/cover;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.35)}
.cover.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:11px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lyric{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.next{font-size:11px;color:rgba(255,255,255,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{height:3px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:4px;overflow:hidden}
.progress .fill{height:100%;background:var(--accent,#007AFF);border-radius:2px;transition:width .4s linear}
.btns{display:flex;align-items:center;gap:8px;margin-top:6px}
.btns button{width:30px;height:30px;border:none;border-radius:8px;background:rgba(255,255,255,.08);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btns button:hover{background:rgba(255,255,255,.16)}
.btns button:active{transform:scale(.92)}
.btns button svg{width:15px;height:15px}
.btns button.play{width:36px;height:36px;border-radius:50%;background:#007AFF}
.btns button.play:hover{background:#3395ff}
body[data-mode="desktop"] .cover{width:56px;height:56px}
body[data-mode="desktop"] .lyric{font-size:19px;font-weight:600}
body[data-mode="desktop"] .next{font-size:12px}
body[data-mode="desktop"] .btns{display:none}
</style>
</head>
<body data-mode="mini">
<div class="mini">
  <div class="cover" id="mCover"></div>
  <div class="main">
    <div class="title" id="mTitle">未在播放</div>
    <div class="artist" id="mArtist">--</div>
    <div class="lyric" id="mLyric">--</div>
    <div class="next" id="mNext"></div>
    <div class="progress"><div class="fill" id="mFill"></div></div>
    <div class="btns">
      <button id="mPrev" title="上一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play" id="mPlay" title="播放/暂停"><svg viewBox="0 0 24 24" fill="currentColor" id="mPlayIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button id="mNextBtn" title="下一首"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
    </div>
  </div>
</div>
<script src="bundle-mini.js"></script>
</body>
</html>
