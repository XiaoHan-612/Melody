<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Melody</title>
<link rel="stylesheet" href="bundle.css">
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar">
    <div class="sb-brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="brand-text">Melody</span></div>
    <div class="sb-search"><svg class="sb-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><input id="searchInput" type="text" placeholder="搜索音乐..." autofocus></div>
    <div class="sb-label">发现</div>
    <div class="nav-item active" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><span class="nav-label">搜索音乐</span></div>
    <div class="sb-label">我的音乐</div>
    <div class="nav-item" data-tab="playlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg><span class="nav-label">我的歌单</span><span class="badge" id="playlistCount">0</span></div>
    <div class="pl-actions">
      <button class="pl-action-btn" id="plImportBtn" title="导入歌单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg></button>
      <button class="pl-action-btn" id="plExportBtn" title="导出歌单"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 8l5-5 5 5"/><path d="M12 3v12"/></svg></button>
      <input type="file" id="plImportFile" accept=".json,application/json" style="display:none">
    </div>
    <div class="pl-list" id="plList"></div>
    <div class="nav-item" data-tab="favlist"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg><span class="nav-label">我喜欢的音乐</span><span class="badge" id="favCount">0</span></div>
    <div class="nav-item" data-tab="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="nav-label">最近播放</span></div>
    <div style="flex:1"></div>
    <div class="nav-item" id="navTheme" data-action="toggleTheme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg><span class="nav-label" id="themeLabel">浅色模式</span></div>
    <div class="nav-item" id="navSettings" data-action="openSettings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span class="nav-label">设置</span></div>
    <div class="sb-version" id="sbVersion">v4.1.0</div>
    <button class="sb-collapse" id="btnCollapse" data-action="toggleSidebar" title="折叠侧边栏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 17-5-5 5-5"/><path d="m18 17-5-5 5-5"/></svg></button>
  </nav>
  <main class="content">
    <div class="page-head"><div><div class="page-title" id="pageTitle">搜索音乐</div><div class="page-sub" id="pageSub">搜索你喜欢的音乐</div></div></div>
    <div class="track-list" id="trackList"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg><div class="text">搜索你喜欢的音乐</div><div style="font-size:13px;opacity:.7">支持酷狗、网易云、B站三个平台</div></div></div>
  </main>
  <aside class="lyric-panel" id="lyricPanel">
    <div class="lyric-head"><span>歌词</span><div style="display:flex;gap:4px;align-items:center"><button class="ctrl-btn" data-action="toggleTranslation" style="font-size:10px;width:auto;padding:0 6px" id="btnTranslation">译</button><button class="ctrl-btn" data-action="adjustLyricOffset" data-arg="-0.5" style="font-size:10px;width:auto;padding:0 6px">-0.5s</button><span id="lyricOffsetDisplay" style="font-size:10px;color:var(--text3);min-width:28px;text-align:center">0s</span><button class="ctrl-btn" data-action="adjustLyricOffset" data-arg="0.5" style="font-size:10px;width:auto;padding:0 6px">+0.5s</button><button class="ctrl-btn" data-action="openLyrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button><button class="ctrl-btn" data-action="toggleLyricPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div></div>
    <div class="lyric-body" id="lyricBody"><div class="lyric-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 6h16M4 12h12M4 18h8"/></svg><span>暂无歌词</span></div></div>
  </aside>
</div>
<div class="immersive-lyrics" id="immersiveLyrics">
  <canvas class="il-canvas" id="ilCanvas"></canvas>
  <div class="il-header"><button class="il-back" data-action="closeLyrics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg></button><div class="il-song-info"><div class="il-title" id="ilTitle">--</div><div class="il-artist" id="ilArtist">--</div></div><div class="il-actions"><button class="il-action-btn" id="ilModeBtn" data-action="cycleILMode" title="背景模式">背景</button><button class="il-action-btn" id="ilFavBtn" data-action="toggleFav" title="收藏">♡</button><button class="il-action-btn" id="ilTransBtn" data-action="toggleTranslation">译</button><button class="il-action-btn" data-action="adjustLyricOffset" data-arg="-0.5">-0.5s</button><button class="il-action-btn" data-action="adjustLyricOffset" data-arg="0.5">+0.5s</button></div></div>
  <div class="il-body" id="ilBody">
    <div class="il-lyrics" id="ilLyrics"></div>
  </div>
  <div class="il-controls"><div class="il-progress" id="ilProgress"><div class="il-progress-fill" id="ilProgressFill"></div></div><div class="il-btns"><button class="ctrl-btn" data-action="prev"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button class="play-btn" id="ilPlayBtn" data-action="toggle"><svg viewBox="0 0 24 24" fill="currentColor" id="ilPlayIcon"><path d="M8 5v14l11-7z"/></svg></button><button class="ctrl-btn" data-action="next"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div></div>
</div>
<canvas class="main-waveform" id="mainWaveform"></canvas>
<footer class="player-bar">
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="player-content">
    <div class="song-info" id="songInfoArea"><div class="song-cover-ph" id="coverImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><div class="song-text"><div class="song-name" id="songName">未在播放</div><div class="song-artist" id="songArtist">--</div><div class="song-time" id="timeDisplay">00:00 / 00:00</div></div></div>
    <div class="controls">
      <button class="ctrl-btn" data-action="skip" data-arg="-10"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg></button>
      <button class="ctrl-btn" id="btnPrev" data-action="prev" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="play-btn" id="btnPlay" data-action="toggle"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl-btn" id="btnNext" data-action="next" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ctrl-btn" data-action="skip" data-arg="10"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <button class="ctrl-btn" id="btnMode" data-action="cycleMode"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg></button>
    </div>
    <div class="extra-controls">
      <button class="ctrl-btn" id="btnFav" data-action="toggleFav" title="收藏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></button>
      <button class="ctrl-btn" id="btnQueue" title="播放队列"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h16M4 14h10M4 18h6"/><circle cx="18" cy="16" r="2.5"/><path d="M20.5 13.5V18"/></svg></button>
      <button class="ctrl-btn" id="btnLyric" data-action="toggleLyricPanel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 10h12M4 14h8M4 18h4"/></svg></button>
      <span class="speed-badge" id="speedBadge" data-action="toggleSpeedMenu">1x</span>
      <div class="volume-wrap" id="volumeWrap"><span class="volume-icon" id="volumeIcon" data-action="toggleMute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></span><input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50"></div>
    </div>
  </div>
</footer>
<audio id="audio"></audio>
<div class="drawer" id="queueDrawer">
  <div class="drawer-head"><span>播放队列</span><div class="drawer-actions"><button class="tr-action-btn" id="queueClear" title="清空队列"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14"/></svg></button><button class="tr-action-btn" id="queueClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
  <div class="queue-list" id="queueList"></div>
</div>
<div class="drawer" id="settingsDrawer">
  <div class="drawer-head"><span>设置</span><div class="drawer-actions"><button class="tr-action-btn" id="settingsClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div></div>
  <div class="settings-body">
    <div class="set-group"><div class="set-label">外观</div>
      <div class="set-row"><span>主题</span><div class="set-seg" id="setTheme"><button data-theme-opt="light">浅色</button><button data-theme-opt="dark">深色</button><button data-theme-opt="system">跟随系统</button></div></div>
    </div>
    <div class="set-group"><div class="set-label">歌词</div>
      <div class="set-row"><span>全屏背景</span><div class="set-seg" id="setILMode"><button data-ilmode="pure">纯净</button><button data-ilmode="spec">频谱</button><button data-ilmode="galaxy">星海</button></div></div>
      <div class="set-row"><span>全屏字号</span><div class="set-inline"><button id="setFontMinus">−</button><span id="setFontVal">52px</span><button id="setFontPlus">+</button></div></div>
      <div class="set-row"><span>点击歌词区播放/暂停</span><label class="switch"><input type="checkbox" id="setClickPlay"></label></div>
    </div>
    <div class="set-group"><div class="set-label">播放</div>
      <div class="set-row"><span>音量</span><input type="range" class="set-vol" id="setVol" min="0" max="100" value="50"></div>
    </div>
    <div class="set-group"><div class="set-label">关于</div>
      <div class="set-row"><span>版本</span><span id="setVersion">v4.1.0</span></div>
      <div class="set-row"><span>诊断日志</span><button class="set-btn" id="setOpenLogs">打开日志目录</button></div>
      <div class="set-row"><span>数据备份</span><button class="set-btn" id="setExportAll">导出全部数据</button></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="context-menu" id="contextMenu"></div>
<div class="speed-menu" id="speedMenu"><button class="menu-item" data-action="setSpeed" data-arg="0.5">0.5x</button><button class="menu-item" data-action="setSpeed" data-arg="0.75">0.75x</button><button class="menu-item active" data-action="setSpeed" data-arg="1">1x</button><button class="menu-item" data-action="setSpeed" data-arg="1.25">1.25x</button><button class="menu-item" data-action="setSpeed" data-arg="1.5">1.5x</button><button class="menu-item" data-action="setSpeed" data-arg="2">2x</button></div>
<script src="bundle.js"></script>
</body>
</html>
